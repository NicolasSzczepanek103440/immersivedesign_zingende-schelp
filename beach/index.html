<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strand</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

</head>
<body>
    <a-scene>
        <a-entity rotation="0 134 0">
            <a-entity camera wasd-controls look-controls position="0 1.6 0" rotation="0 0 0">
                <a-sphere src="textures/beach_ball.jpeg" width="10" height="10" depth="10" position="2 -1.5 -4" rotation="0 -140 0"></a-sphere>
                <a-entity cursor="rayOrigin: mouse;" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" material="color: black; shader: flat"></a-entity>
            </a-entity>
        </a-entity>

        <a-sky color="#a4c6fc" rotation="0 -135 0"></sky>

        <a-plane width="100" height="100" rotation="-90 0 0" color="#fcba03" src="textures/sand.jpg" position="0 -10 0"></a-plane>
        <a-plane width="100" height="100" rotation="-90 0 0" position="-100 -10 0" color="blue"></a-plane>
    
        <a-box width="6" height="6" depth="6" color="white" position="-30 -3 0" material="src: textures/schelp.jpg" animation="property: rotation; to: 360 360 0; easing: linear; loop: true; dur: 4000;" sound="src: url(audio/troll.mp3); on: click; volume: 30">
        </a-box>
    </a-scene>
</body>
</html>
